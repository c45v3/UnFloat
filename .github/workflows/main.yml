name: Release_Build
on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'versionCode'
        required: true
        type: number
      version_name:
        description: 'versionName'
        required: true
        type: string
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PversionCode=${{ inputs.version_code }} -PversionName=${{ inputs.version_name }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UnFloat-${{ inputs.version_code }}
          path: app/build/outputs/apk/release/*.apk
